[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flydnet"
dynamic = ["version"]
description = "Drosophila connectome (FlyWire v783) as neural-network layers, with its own autograd engine on NumPy/CuPy (PyTorch optional)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ email = "icecx17@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.9", "pandas>=1.5", "pyarrow>=10"]
keywords = ["connectome", "drosophila", "flywire", "spiking neural network", "autograd", "numpy", "cupy", "neuroscience"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
torch = ["torch>=2.1"]                   # torch 연동 (flydnet.torch, ConnectomeLayer 등 0.1.0 기능)
gpu-cuda12 = ["cupy-cuda12x>=13"]        # GPU (CUDA 12.x 드라이버)
gpu-cuda13 = ["cupy-cuda13x>=14"]        # GPU (CUDA 13.x 드라이버)
examples = ["torch>=2.1", "torchvision"]
dev = ["pytest", "torch>=2.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]                                  # flydnet과 하위 패키지(ganglion, torch)를 모두 포함

[tool.setuptools.dynamic]
version = { attr = "flydnet.__version__" }      # 버전은 src/flydnet/__init__.py 한 곳에서만

[tool.pytest.ini_options]
testpaths = ["tests"]
