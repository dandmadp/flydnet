[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flydnet"
version = "0.1.0"
description = "초파리 커넥톰(FlyWire v783)을 배선으로 쓰는 스파이킹 신경망 층"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "pyarrow", "torch"]

[project.optional-dependencies]
examples = ["torchvision"]
dev = ["pytest"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["flydnet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
